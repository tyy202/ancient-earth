<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>古地球 · 地球的历史变迁</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top">
    <strong class="main-heading">
      <span class="desktop-copy">看看</span><label class="mobile-copy" for="years-ago">古地球</label>
      <select id="years-ago" aria-label="选择年代">
        <option value="600">6 亿年前</option>
        <option value="560">5.6 亿年前</option>
        <option value="540">5.4 亿年前</option>
        <option value="500">5 亿年前</option>
        <option value="470">4.7 亿年前</option>
        <option value="450">4.5 亿年前</option>
        <option value="430">4.3 亿年前</option>
        <option value="400">4 亿年前</option>
        <option value="370">3.7 亿年前</option>
        <option value="340">3.4 亿年前</option>
        <option value="300">3 亿年前</option>
        <option value="280">2.8 亿年前</option>
        <option value="260">2.6 亿年前</option>
        <option value="240">2.4 亿年前</option>
        <option value="220">2.2 亿年前</option>
        <option value="200">2 亿年前</option>
        <option value="170">1.7 亿年前</option>
        <option value="150">1.5 亿年前</option>
        <option value="120">1.2 亿年前</option>
        <option value="105">1.05 亿年前</option>
        <option value="90">9000 万年前</option>
        <option value="65">6500 万年前</option>
        <option value="50">5000 万年前</option>
        <option value="35">3500 万年前</option>
        <option value="20">2000 万年前</option>
        <option value="0">现代</option>
      </select>
      <span class="desktop-copy">的地球是什么样子？</span>
    </strong>
  </div>
  <div id="controls">
    <div class="jump-to-container">
      <label for="jump-to">跳转到：</label>
      <select id="jump-to" class="button">
        <option value="600">最早的多细胞生命</option>
        <option value="540">最早的壳体</option>
        <option value="470">最早的珊瑚礁</option>
        <option value="470">最早的脊椎动物</option>
        <option value="430">最早的陆生植物</option>
        <option value="400">最早的陆生动物</option>
        <option value="400">最早的昆虫</option>
        <option value="300">最早的爬行动物</option>
        <option value="220">最早的恐龙</option>
        <option value="120">最早的花</option>
        <option value="35">最早的灵长类动物</option>
        <option value="35">最早的禾本科植物</option>
        <option value="20">最早的人科动物</option>

        <option value="600">潘诺西亚超大陆</option>
        <option value="280">盘古超大陆</option>
        <option value="240">三叠纪</option>
        <option value="170">侏罗纪</option>
        <option value="105">白垩纪</option>
        <option value="65">恐龙灭绝</option>
      </select>
    </div>
    <div class="view-controls">
      <button type="button" id="remove-clouds" class="button" aria-pressed="false">隐藏云层</button>
      <button type="button" id="stop-rotation" class="button" aria-pressed="false">停止自转</button>
    </div>
  </div>
  <section id="info-panel" aria-label="年代说明">
    <div class="info-heading">
      <h1 class="title">地球 · <span id="how-long-ago">6 亿年前</span></h1>
      <button type="button" id="explanation-toggle" aria-expanded="false" aria-controls="explanation">展开说明</button>
    </div>
    <div id="explanation"></div>
  </section>
  <div id="instructions">
    <span class="desktop-copy">拖动旋转 · 滚轮缩放 · ← → 切换年代</span>
    <span class="mobile-copy">单指旋转 · 双指缩放</span>
  </div>

  <div id="loading" role="status">正在加载……</div>

	<div id="webgl"></div>

	<script src="js/three.min.js"></script>
	<script src="js/Detector.js"></script>
	<script src="js/OrbitControls.js"></script>
	<script src="js/THREEx.WindowResize.js"></script>
	<script src="js/countdown.min.js"></script>
	<script src="js/explain.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
