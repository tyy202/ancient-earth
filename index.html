<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>古地球 · 地球的历史变迁</title>
	<style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }
		.tm  { position: absolute; top: 10px; right: 10px; }
		.webgl-error { font: 15px/30px monospace; text-align: center; color: #fff; margin: 50px; }
		.webgl-error a { color: #fff; }
    #webgl {
    }
    .top {
      z-index: 999990;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background-color: black;
      border-bottom: 1px solid #404040;
      z-index: 999999;
      color: white;
      line-height: 2.5;
      text-align: center;
    }

    a {
      color: white;
    }

    .top-sub {
      position: absolute;
      top: 50px;
      left: 0;
      color: #aaa;
      text-align: center;
      width: 100%;
    }

    .title {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      position:absolute;
      bottom:20px;
      left: 20px ;
      color: white;
    }

    #years-ago {
      font-weight: bold;
    }

    #explanation {
      font-size: 14px;
      position:absolute;
      bottom: 80px;
      left: 20px ;
      width: 300px;
      line-height: 1.5;
      color: #eee;
    }

    #instructions {
      font-size: 12px;
      position: absolute;
      bottom: 20px;
      right: 30px;
      color: #eee;
    }

    #controls {
      font-size: 12px;
      position: absolute;
      top: 50px;
      right: 30px;
      color: #eee;
      text-align: right;
    }

    #controls .button {
      background-color: #202020;
      cursor: pointer;
      padding: 5px;
      border-radius: 5px;
      line-height: 2.5;
    }

    #controls span:hover {
      background-color: #303030;
    }

    .jump-to-container {
      margin-bottom: 3px;
    }

    #jump-to {
      color: #fff;
    }

    #loading {
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      position: absolute;
      top: 45%;
      width: 100%;
      color: #fff;
    }

    @media screen and (max-width: 1024px) {
      .top, .top-sub, #explanation {
        font-size: 12px;
      }

      #instructions {
        display: none;
      }

      .main-heading {
        line-height: 3.5;
      }
    }
    </style>
</head>
<body>
  <div class="top">
    <strong class="main-heading">
      看看
      <select id="years-ago">
        <option value="600">6 亿年前</option>
        <option value="560">5.6 亿年前</option>
        <option value="540">5.4 亿年前</option>
        <option value="500">5 亿年前</option>
        <option value="470">4.7 亿年前</option>
        <option value="450">4.5 亿年前</option>
        <option value="430">4.3 亿年前</option>
        <option value="400">4 亿年前</option>
        <option value="370">3.7 亿年前</option>
        <option value="340">3.4 亿年前</option>
        <option value="300">3 亿年前</option>
        <option value="280">2.8 亿年前</option>
        <option value="260">2.6 亿年前</option>
        <option value="240">2.4 亿年前</option>
        <option value="220">2.2 亿年前</option>
        <option value="200">2 亿年前</option>
        <option value="170">1.7 亿年前</option>
        <option value="150">1.5 亿年前</option>
        <option value="120">1.2 亿年前</option>
        <option value="105">1.05 亿年前</option>
        <option value="90">9000 万年前</option>
        <option value="65">6500 万年前</option>
        <option value="50">5000 万年前</option>
        <option value="35">3500 万年前</option>
        <option value="20">2000 万年前</option>
        <option value="0">现代</option>
      </select>
      的地球是什么样子？
    </strong>
  </div>
  <div id="controls">
    <div class="jump-to-container">
      <span>跳转到：</span>
      <select id="jump-to" class="button">
        <option value="600">最早的多细胞生命</option>
        <option value="540">最早的壳体</option>
        <option value="470">最早的珊瑚礁</option>
        <option value="470">最早的脊椎动物</option>
        <option value="430">最早的陆生植物</option>
        <option value="400">最早的陆生动物</option>
        <option value="400">最早的昆虫</option>
        <option value="300">最早的爬行动物</option>
        <option value="220">最早的恐龙</option>
        <option value="120">最早的花</option>
        <option value="35">最早的灵长类动物</option>
        <option value="35">最早的禾本科植物</option>
        <option value="20">最早的人科动物</option>

        <option value="600">潘诺西亚超大陆</option>
        <option value="280">盘古超大陆</option>
        <option value="240">三叠纪</option>
        <option value="170">侏罗纪</option>
        <option value="105">白垩纪</option>
        <option value="65">恐龙灭绝</option>
      </select>
    </div>
    <span id="remove-clouds" class="button">隐藏云层</span><br>
    <span id="stop-rotation" class="button">停止自转</span>
  </div>
  <div id="explanation"></div>
  <div id="instructions">
    使用 ← 和 → 方向键切换年代。
  </div>
  <div class="title">地球 · <span id="how-long-ago">6 亿年前</span></div>

  <div id="loading">正在加载……</div>

	<div id="webgl"></div>

	<script src="js/three.min.js"></script>
	<script src="js/Detector.js"></script>
	<script src="js/OrbitControls.js"></script>
	<script src="js/THREEx.WindowResize.js"></script>
	<script src="js/countdown.min.js"></script>
	<script src="js/explain.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
